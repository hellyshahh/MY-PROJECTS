<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form{
            width: 50%;
            height: 100px;
            margin: auto;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        #task{
            height: 35px;
            margin-top: 10px;
            width: 90%;
        }
        #add{
            margin-top: 15px;
            width: 120px;
            height: 35px;
        }
        .container{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            justify-self: center;
            background-color: aquamarine;
            border: 2px solid black;
            width: 50%;

        }
        .tasks{
            width: 90%;
            /* height: 100px; */
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: antiquewhite;
            border: 2px solid black;
            margin: 5px;
            padding: 10px 15px;
            position: relative;
        }
        .menu-btn{
            display: flex;
            border: none;
            background: transparent;
            font-size: 22px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .popup{
            position: absolute;
            right: 10px;
            top: 100%;
            display: none;
            width: 150px;
            background-color: white;
            border-radius: 8px;
            border: 1px solid #ccc;
            overflow: hidden;
            z-index: 100;
        }
        .popup.show{
            display: block;
        }
        .popup button{
            width: 100%;
            border: none;
            background: white;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <header>
        <h1><center>TO DO LIST</center></h1>
    </header>
    <main>
        <h2><center>Please enter your Tasks Below</center></h2>
        <form action="" method="POST">
            <input type="text" task="" placeholder="Enter your task here" id="task">
            <button id="add">ADD</button>
        </form>
        <hr>
        <div class="container">
             
        </div>
    </main>
    <hr>
    
</body>
<script src="Script.js"></script>
</html>
