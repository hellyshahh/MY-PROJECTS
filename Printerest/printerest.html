<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="printerest.css">
</head>
<body>
    <header class="navbar">
        <div class="leftnav">
            <img src="https://download.logo.wine/logo/Pinterest/Pinterest-Logo.wine.png">
            <a href="#"><h3>Explore</h3></a>
        </div>
        <div class="rightnav">
            <button class="red">Log in</button>
            <button class="white">Download</button>
        </div>
    </header>
    <div class="hero-section">
        <div class="hero-img">
            <img src="https://i1-e.pinimg.com/736x/8c/32/33/8c32334fb2b4fc8941a2abbff9678411.jpg">
        </div>
        <div class="hero-line">
            <h1>Create the life you love on Printerest</h1>
        </div>
        <div class="hero-button">
            <button class="red">Join Printerest for Free</button>
            <button class="white">I already have an account</button>
        </div>
    </div>
    <div class="main-section">
        <div class="main-line">
            <div class="line-1"><h1>Bring your favorite ideas to life</h1></div>
            <div class="line-2"><h3>With Pinterest, you can unlock tools that spark your creativity and help you</h3></div>
            <div class="line-3"><h3>find more inspiration.</h3></div> 
        </div>
        <div class="sec-1">
            <div class="left-main">
                <img src="https://i.pinimg.com/originals/31/e8/45/31e8455b6b965b1b93b35c0b4466f836.png">
            </div>
            <div class="right-main">
                <div class="right-line-1"><h2>Search by skin tone</h2></div>
                <div class="right-line-2"><h3>Search with skin tone ranges for beauty ideas that<br> represent you</h3></div>
                <button class="red">Join Printerest</button>
            </div>
        </div>
    </div>
</body>
</html>
